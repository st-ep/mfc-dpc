# Quick test config with fewer epochs
seed: 42

dynamics:
  name: vanderpol
  mu_range: [0.5, 2.5]
  test_mus: [0.5, 1.5, 2.5, 3.5]

model:
  num_basis: 16
  hidden_dim: 64
  nesting_dims: [2, 4, 8, 16]

training:
  fe_epochs: 500
  dpc_epochs: 1000
  lr: 0.001
  weight_decay: 0.0001
  # Option 2: Diversity regularization for separate MLPs
  use_diversity_reg: true     # Enable diversity + weighted ridge for Sep MLPs
  diversity_beta: 0.1        # Diversity penalty weight
  ridge_alpha: 1.3            # Weighted ridge growth factor

evaluation:
  n_tests: 20
  horizon: 50
